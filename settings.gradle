pluginManagement {
    repositories {
        maven {
            url 'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
        }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        mavenLocal()
        maven {
            url 'https://artifactory.platform.hmcts.net/artifactory/maven-remotes'
        }
        if (!System.getenv('CI')) {
            mavenCentral()
        }
    }
}