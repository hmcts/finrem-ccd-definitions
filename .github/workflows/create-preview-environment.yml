name: Create Preview Environment
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      jira:
        description: 'Jira DFR-'
        required: true
        type: string
      finrem-cos-pr:
        description: 'finrem-cos PR #'
        required: true
        type: string
      title:
        description: 'PR Title'
        required: false
        type: string
      branch-name:
        description: 'Branch name'
        required: false
        type: string

jobs:
  create-pr:
    name: Create Pull Request
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set branch name
        run: |
          if [ -z "${{ github.event.inputs.branch-name }}" ]; then
            echo "BRANCH_NAME=dfr-${{ github.event.inputs.jira }}-preview-env" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${{ github.event.inputs.branch-name }}" >> $GITHUB_ENV
          fi

      - name: Create new branch with empty commit
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          
          # Ensure remote refs are available
          git fetch origin --prune
          
          # Prefer the repository default branch from remote; fallback to master
          if git show-ref --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          elif git show-ref --verify --quiet "refs/remotes/origin/master"; then
            git checkout -B master origin/master
            DEFAULT_BRANCH=master
          else
            echo "Could not find origin/${DEFAULT_BRANCH} or origin/master"
            git branch -a
            exit 1
          fi
          
          git checkout -b "$BRANCH_NAME"
          git commit --allow-empty -m "Empty commit"
          git push origin "$BRANCH_NAME"

      - name: Ensure label exists
        run: |
          gh label create "use-pr-${{ github.event.inputs.finrem-cos-pr }}" --color "#ededed" --description "Preview environment PR" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set PR title
        run: |
          if [ -z "${{ github.event.inputs.title }}" ]; then
            echo "PR_TITLE=DFR-${{ github.event.inputs.jira }}: Preview environment" >> $GITHUB_ENV
          else
            echo "PR_TITLE=${{ github.event.inputs.title }}" >> $GITHUB_ENV
          fi

      - name: Set PR body
        run: |
          if [ -n "${{ github.event.inputs.jira }}" ]; then
            echo "PR_BODY=See [DFR-${{ github.event.inputs.jira }}](https://tools.hmcts.net/jira/browse/DFR-${{ github.event.inputs.jira }})" >> $GITHUB_ENV
          fi

      - name: Create pull request
        run: |
          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base "${{ github.event.repository.default_branch }}" \
            --head $(git rev-parse --abbrev-ref HEAD) \
            --label "use-pr-${{ github.event.inputs.finrem-cos-pr }}" \
            --label "enable_keep_helm" \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PR body with preview environment links
        run: |
          PR_NUMBER=$(gh pr view --json number -q ".number")
          NEW_BODY="$PR_BODY
            - Manage Cases : https://xui-finrem-ccd-definitions-pr-$PR_NUMBER.preview.platform.hmcts.net
            - Manage Orgs  : https://xui-mo-finrem-ccd-definitions-pr-$PR_NUMBER.preview.platform.hmcts.net
            - CCD Admin Web: https://admin-web-finrem-ccd-definitions-pr-$PR_NUMBER.preview.platform.hmcts.net"
          gh pr edit "$PR_NUMBER" --body "$NEW_BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set PR body
        run: |
          PREVIEW_LABEL="use-pr-${{ github.event.inputs.finrem-cos-pr }}"
          if [ -n "${{ github.event.inputs.jira }}" ]; then
            {
              echo "PR_BODY<<EOF"
              echo "See [DFR-${{ github.event.inputs.jira }}](https://tools.hmcts.net/jira/browse/DFR-${{ github.event.inputs.jira }})"
              echo "<!-- preview-label:${PREVIEW_LABEL} -->"
              echo "<!-- preview-keep-helm:enable_keep_helm -->"
              echo "EOF"
            } >> "$GITHUB_ENV"
          fi
